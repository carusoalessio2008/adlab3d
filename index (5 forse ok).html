<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AdLab3D Gestionale Cloud</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface2:#e9ebf1; --field:#fafbfd; --line:#d9dce5;
  --fg:#13161e; --muted:#586073; --accent:#d9480f; --accent-fg:#ffffff; --accent-soft:#fde4d6;
  --ok:#17794a; --ok-soft:#d9f2e4; --warn:#9a5b00; --warn-soft:#fbe9c6; --bad:#b4302f; --bad-soft:#f9dbdb; --info:#2956c9; --info-soft:#dde7fb;
  --cube-t:#4a505c; --cube-l:#1a1d24; --cube-r:#0b0c10;
  --seg-mat:#d9480f; --seg-en:#2956c9; --seg-lab:#17794a; --seg-mach:#b07d12; --seg-oth:#7b8294;
  --font-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface2:#1f2430; --field:#11151c; --line:#2b3242;
  --fg:#e7eaf1; --muted:#98a1b4; --accent:#ff7a3d; --accent-fg:#1a0e06; --accent-soft:#3b2314;
  --ok:#56c88a; --ok-soft:#143023; --warn:#e8b04a; --warn-soft:#38290e; --bad:#ff8080; --bad-soft:#3b1c1c; --info:#7ea5ff; --info-soft:#1b2644;
  --cube-t:#eef0f5; --cube-l:#aab1bf; --cube-r:#7b8393;
  --seg-mat:#ff7a3d; --seg-en:#7ea5ff; --seg-lab:#56c88a; --seg-mach:#e8b04a; --seg-oth:#8a93a6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface2:#1f2430; --field:#11151c; --line:#2b3242;
  --fg:#e7eaf1; --muted:#98a1b4; --accent:#ff7a3d; --accent-fg:#1a0e06; --accent-soft:#3b2314;
  --ok:#56c88a; --ok-soft:#143023; --warn:#e8b04a; --warn-soft:#38290e; --bad:#ff8080; --bad-soft:#3b1c1c; --info:#7ea5ff; --info-soft:#1b2644;
  --cube-t:#eef0f5; --cube-l:#aab1bf; --cube-r:#7b8393;
  --seg-mat:#ff7a3d; --seg-en:#7ea5ff; --seg-lab:#56c88a; --seg-mach:#e8b04a; --seg-oth:#8a93a6;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.r{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.93em}
.r{text-align:right}
.muted{color:var(--muted)}

/* Auth Screen */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;text-decoration:none;color:var(--fg)}
.auth-brand svg{width:40px;height:40px;flex:none}
.auth-brand b{display:block;font:700 20px/1 var(--font-display);letter-spacing:.02em}
.auth-brand small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.auth-error{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:7px;font-size:13px;display:none}
.auth-success{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:7px;font-size:13px;display:none}

/* Modal Popup */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:450px;box-shadow:0 10px 30px rgba(0,0,0,0.15);display:flex;flex-direction:column;gap:16px;transform:translateY(10px);transition:transform .2s}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-h{display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:18px}
.modal-body{display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:30px;max-width:1380px;margin:0 auto;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:22px;align-self:start;display:flex;flex-direction:column;gap:22px;min-width:0}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--fg)}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font:700 19px/1 var(--font-display);letter-spacing:.02em}
.brand small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
.ct{fill:var(--cube-t)} .cl{fill:var(--cube-l)} .cr{fill:var(--cube-r)}
.ax{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;fill:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:7px;color:var(--fg);text-decoration:none;font-weight:500;white-space:nowrap;cursor:pointer}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--fg);color:var(--bg)}
.bdg{min-width:22px;padding:0 7px;border-radius:99px;font:500 12px/20px var(--font-mono);text-align:center;background:var(--surface2);color:var(--fg)}
.nav a.on .bdg{background:var(--bg);color:var(--fg)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.side-foot{display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:12px;color:var(--muted)}
main{min-width:0}

/* page head */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:30px;line-height:1.1}
.ph p{margin-top:6px;color:var(--muted);max-width:60ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.h2{font-size:19px;margin:34px 0 12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 15px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.w-full{width:100%}

/* fields */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--field)}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--field);cursor:pointer}
select{padding-right:6px}
textarea{font:12px/1.45 var(--font-mono);min-height:120px;resize:vertical}
.unit{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--field);padding-right:10px}
.unit:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.unit input{border:0;background:transparent;outline:0;min-width:0}
.unit span{color:var(--muted);font-size:12.5px;white-space:nowrap}

/* sections / cards */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 376px;gap:22px;align-items:start}
.qform{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}
.sec-h h3{font-size:16px}
.subt{font:500 14px var(--font-mono);color:var(--muted)}
.drop{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:8px;cursor:pointer;background:var(--field)}
.drop:hover{border-color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop b{font-weight:600}
.drop small{display:block;color:var(--muted)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:10px;margin-bottom:10px;align-items:center}
.sum{position:sticky;top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font:700 44px/1.05 var(--font-display);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);margin:16px 0 12px;gap:2px}
.bar i{display:block;min-width:3px}
.seg-mat{background:var(--seg-mat)} .seg-en{background:var(--seg-en)} .seg-lab{background:var(--seg-lab)} .seg-mach{background:var(--seg-mach)} .seg-oth{background:var(--seg-oth)}
.brk{width:100%;border-collapse:collapse;font-size:13px}
.brk th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;padding:4px 0}
.brk th:first-child{text-align:left}
.brk td{padding:6px 0;border-top:1px solid var(--line);text-align:right}
.brk td:first-child{text-align:left}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.tot{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:12px;font-size:13.5px}
.tot dt{color:var(--muted)} .tot dd{margin:0;text-align:right}
.tot .strong{font-weight:600;color:var(--fg)}
.note{margin-top:10px;padding:8px 10px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.sum-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
td input,td select{min-width:92px}
td.act{white-space:nowrap;text-align:right}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.rbar{display:inline-block;vertical-align:middle;width:84px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-right:8px}
.rbar i{display:block;height:100%;background:var(--ok)}
.rbar.low i{background:var(--warn)}

/* pills + status selects */
.pill,select.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;border:0;min-height:0;width:auto}
select.st{padding:5px 8px;min-width:118px}
.st-nuovo{background:var(--info-soft);color:var(--info)}
.st-da-avviare,.st-bozza{background:var(--surface2);color:var(--muted)}
.st-in-stampa{background:var(--accent-soft);color:var(--accent)}
.st-pronto,.st-ordine{background:var(--ok-soft);color:var(--ok)}
.st-consegnato{background:var(--surface2);color:var(--fg)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font:700 32px/1.1 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h3{font-size:16px;margin-bottom:10px}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.al:first-of-type{border-top:0}
.al small{display:block;color:var(--muted)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:11px 14px;border-radius:9px;background:var(--info-soft);color:var(--info)}
.banner span{color:var(--fg)}
.intro{margin:-6px 0 14px;color:var(--muted);max-width:70ch}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100vw - 32px);transition:opacity .18s,transform .18s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- SCHERMATA DI AUTENTICAZIONE -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <polygon class="ct" points="24,5 40,14 24,23 8,14"/>
        <polygon class="cl" points="8,14 24,23 24,43 8,34"/>
        <polygon class="cr" points="24,23 40,14 40,34 24,43"/>
        <path class="ax" d="M24 43 V23 M24 43 L8 34 M24 43 L40 34"/>
      </svg>
      <div><b>ADLAB3D</b><small id="auth-title">Accedi al gestionale</small></div>
    </div>
    
    <form id="auth-form" class="auth-form">
      <label class="fld"><span class="lbl">Email</span><input type="email" id="auth-email" required placeholder="nome@email.it"></label>
      <label class="fld"><span class="lbl">Password</span><input type="password" id="auth-password" required placeholder="••••••••"></label>
      
      <div id="auth-error" class="auth-error"></div>

        <!-- Pulsante separato ben visibile per passare da Login a Registrazione -->

      </div>
    </form>
  </div>
</div>

<!-- MODALE POPUP GENERICO -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-h">
      <h3 id="modal-title">Titolo</h3>
      <button class="btn ghost sm" type="button" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn ghost sm" type="button" id="modal-cancel">Annulla</button>
      <button class="btn pri sm" type="button" id="modal-save">Salva</button>

<!-- APPLICAZIONE PRINCIPALE -->
<div id="app-container" style="display:none;">
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#panoramica" aria-label="AdLab3D, panoramica">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <polygon class="ct" points="24,5 40,14 24,23 8,14"/>
          <polygon class="cl" points="8,14 24,23 24,43 8,34"/>
          <polygon class="cr" points="24,23 40,14 40,34 24,43"/>
          <path class="ax" d="M24 43 V23 M24 43 L8 34 M24 43 L40 34"/>
        </svg>
        <span><b>ADLAB3D</b><small id="user-email-display">Cloud Sync</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Sezioni"></nav>
      <div class="side-foot">
        <button class="btn sm" id="themebtn" data-action="theme" type="button">Tema scuro</button>
        <button class="btn sm danger" id="logoutbtn" data-action="logout" type="button">Esci dall'account</button>
        <p>Sincronizzato in tempo reale.</p>
      </div>

    <main id="view"></main>
  </div>
</div>

<script>
/* ================= CONFIGURAZIONE SUPABASE ================= */
const SUPABASE_URL = window.SUPABASE_URL || 'https://hnolrnviraoknrxncqdk.supabase.co';
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_yLiy6rrZ4odJx7khvDgtdA_AR0vHS-r';

let supabaseClient = null;
if(window.supabase && SUPABASE_URL !== 'IL_TUO_SUPABASE_URL'){
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

/* ---------- Motore di calcolo e G-code ---------- */
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}

function parseDur(s){
  if(!s) return null;
  var sec=0, found=false;
  var parts=[[/(\d+(?:\.\d+)?)\s*d/i,86400],[/(\d+(?:\.\d+)?)\s*h/i,3600],[/(\d+(?:\.\d+)?)\s*m(?!s)/i,60],[/(\d+(?:\.\d+)?)\s*s/i,1]];
  for(var i=0;i<parts.length;i++){
    var m=s.match(parts[i][0]);
    if(m){sec+=parseFloat(m[1])*parts[i][1];found=true}
  }
  return found?sec:null;
}

function parseGcode(txt){
  var res={minutes:null,grams:null};
  var tre=[
    /;\s*estimated printing time \(normal mode\)\s*[=:]\s*([^\r\n;]+)/i,
    /;\s*total estimated time\s*[=:]\s*([^\r\n;]+)/i,
    /;\s*model printing time\s*[=:]\s*([^\r\n;]+)/i
  ];
  for(var i=0;i<tre.length;i++){
    var m=txt.match(tre[i]);
    if(m){var s=parseDur(m[1]);if(s!==null){res.minutes=Math.max(1,Math.round(s/60));break}}
  }
  var wre=[
    /;\s*total filament weight \[g\]\s*[=:]\s*([ \d.,]+)/i,
    /;\s*total filament used \[g\]\s*[=:]\s*([ \d.,]+)/i,
    /;\s*filament used \[g\]\s*[=:]\s*([ \d.,]+)/i
  ];
  for(var j=0;j<wre.length;j++){
    var w=txt.match(wre[j]);
    if(w){
      var g=w[1].split(',').map(function(x){return parseFloat(x)}).filter(function(x){return isFinite(x)}).reduce(function(a,b){return a+b},0);
      if(g>0){res.grams=Math.round(g*100)/100;break}
    }
  }
  return res;
}

function machHour(p){
  var y=num(p.years),h=num(p.hoursDay);
  if(y<=0||h<=0) return 0;
  return num(p.price)/(y*365*h)*(1+num(p.repair)/100);
}

function calc(q){
  var hrs=num(q.hours)+num(q.minutes)/60;
  var mat=num(q.spoolWeight)>0?num(q.grams)/num(q.spoolWeight)*num(q.spoolPrice):0;
  var en=num(q.watts)/1000*hrs*num(q.energy);
  var lab=num(q.prepMin)/60*num(q.prepRate)+num(q.postMin)/60*num(q.postRate);
  var mach=hrs*machHour({price:q.machPrice,years:q.years,hoursDay:q.hoursDay,repair:q.repair});
  var oth=(q.extras||[]).reduce(function(a,x){return a+num(x.amount)},0);
  var def=[['mat','Filamento',mat,q.markMat],['en','Elettricità',en,q.markEn],['lab','Manodopera',lab,q.markLab],['mach','Macchina e manutenzione',mach,q.markMach],['oth','Altri costi',oth,q.markOther]];
  var rows=def.map(function(d){var m=num(d[3]);return {id:d[0],label:d[1],cost:d[2],mark:m,price:d[2]*(1+m/100)}});
  var cost=rows.reduce(function(a,r){return a+r.cost},0);
  var sub=rows.reduce(function(a,r){return a+r.price},0);
  var min=num(q.minPrice);
  var minApplied=sub<min;
  var net=Math.round(Math.max(sub,min)*100)/100;
  var vat=Math.round(net*num(q.vat))/100;
  vat=Math.round(vat*100)/100;
  return {hrs:hrs,rows:rows,cost:cost,sub:sub,minApplied:minApplied,net:net,vat:vat,total:Math.round((net+vat)*100)/100};
}

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.style.display = 'none';
  authSuccess.style.display = 'none';

  if(!supabaseClient){ 
    authError.textContent = 'Configura prima le credenziali di Supabase nel codice!';
    authError.style.display = 'block';
    return; 
  }
  
  const email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  
  authSubmit.disabled = true;
  authSubmit.textContent = isSignUp ? 'Registrazione in corso...' : 'Accesso in corso...';

  try {
    if(isSignUp){
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      
      authSuccess.textContent = 'Registrazione completata con successo! Ora puoi effettuare il login.';
      authSuccess.style.display = 'block';
      isSignUp = false;
      authTitle.textContent = 'Accedi al gestionale';
      authSubmit.textContent = 'Accedi';
      authToggleBtn.textContent = 'Non hai un account? Registrati';
      authForm.reset();
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
      if(data.user) {
        initApp(data.user);
      }
    }
  } catch (err) {
    authError.textContent = err.message || 'Errore durante l\'autenticazione.';
    authError.style.display = 'block';

    authSubmit.disabled = false;
    if(!isSignUp && authSubmit.textContent.includes('Accesso')) {

      authSubmit.textContent = 'Registrati ora';

/* Sincronizzazione Database Supabase */
async function loadCloudData(){
  if(!supabaseClient) return;
  let { data: settingsData } = await supabaseClient.from('settings').select('*').single();
  if(settingsData) state.settings = settingsData;

  const tables = ['customers', 'printers', 'spools', 'orders', 'quotes', 'movements', 'files'];
  for(let t of tables){
    let { data } = await supabaseClient.from(t).select('*');
    if(data) state[t] = data;
  }
}

function setupRealtime(){
  if(!supabaseClient) return;
  const tables = ['settings', 'customers', 'printers', 'spools', 'orders', 'quotes', 'movements', 'files'];
  tables.forEach(t => {
    supabaseClient.channel('public:' + t)
      .on('postgres_changes', { event: '*', schema: 'public', table: t }, async () => {
        await loadCloudData();
        render();
      })
      .subscribe();
  });
}

async function saveData(table, item){
  if(!supabaseClient) return;
  await supabaseClient.from(table).upsert(item);
}

async function deleteData(table, id){
  if(!supabaseClient) return;
  await supabaseClient.from(table).delete().eq('id', id);
}

var AFTER={preventivi:function(){updateSummary()}};
function nav(){
  $('#nav').innerHTML=VIEWS.map(function(v){return '<a href="#'+v[0]+'" class="'+(v[0]===view?'on':'')+'">'+v[1]+'</a>'}).join('');
}
function render(){nav();$('#view').innerHTML=V[view]();if(AFTER[view])AFTER[view]()}
function route(){
  var h=location.hash.slice(1);
  if(h === 'impostazioni' && userRole !== 'admin'){
    h = 'panoramica';
    location.hash = '#panoramica';
  }
  view=VIEWS.some(function(v){return v[0]===h})?h:'panoramica';
  render();
}

var ACTIONS={
  theme:function(){var th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);localStorage.setItem(THEME_KEY,th)},
  
  openModalAdd:async function(b){
    var c=b.dataset.coll;
    if(c==='customers'){
      openModal('Nuovo Cliente', `
        <label class="fld"><span class="lbl">Nome e Cognome</span><input type="text" id="m-name" required></label>
        <label class="fld"><span class="lbl">Telefono</span><input type="text" id="m-phone"></label>
        <label class="fld"><span class="lbl">Email</span><input type="email" id="m-email"></label>
        <label class="fld"><span class="lbl">Note</span><textarea id="m-note" style="min-height:60px"></textarea></label>
      `, async function(){
        var item={
          id:uid(),
          name:$('#m-name').value || 'Nuovo Cliente',
          phone:$('#m-phone').value,
          email:$('#m-email').value,
          note:$('#m-note').value
        };
        state.customers.unshift(item);
        await saveData('customers', item);
        closeModal();
        render();
        toast('Cliente aggiunto');
      });
    } else if(c==='spools'){
      openModal('Nuova Bobina / Magazzino', `
        <label class="fld"><span class="lbl">Materiale</span>
          <select id="m-mat"><option>PLA</option><option>PETG</option><option>ABS</option><option>TPU</option><option>ASA</option></select>
        </label>
        <label class="fld"><span class="lbl">Nome Colore</span><input type="text" id="m-colorname" placeholder="es. Nero Opaco"></label>
        <label class="fld"><span class="lbl">Colore (Tinta)</span><input type="color" id="m-color" value="#1d1d1f"></label>
        <label class="fld"><span class="lbl">Prezzo bobina (€)</span><input type="number" id="m-price" value="20" step="any"></label>
        <label class="fld"><span class="lbl">Peso totale (g)</span><input type="number" id="m-weight" value="1000"></label>
        <label class="fld"><span class="lbl">Quantità Bobine</span><input type="number" id="m-qty" value="1" min="1"></label>
      `, async function(){
        var qty = parseInt($('#m-qty').value) || 1;
        var w = parseFloat($('#m-weight').value) || 1000;
        for(let i=0; i<qty; i++){
          var item={
            id:uid(),
            material:$('#m-mat').value,
            colorName:$('#m-colorname').value,
            color:$('#m-color').value,
            brand:'Generico',
            price:parseFloat($('#m-price').value) || 20,
            weight:w,
            residual:w
          };
          state.spools.unshift(item);
          await saveData('spools', item);
        }
        closeModal();
        render();
        toast('Bobina/e aggiunta/e');
      });
    } else if(c==='movements'){
      openModal('Nuovo Movimento Contabile', `
        <label class="fld"><span class="lbl">Data</span><input type="date" id="m-date" value="`+todayISO()+`"></label>
        <label class="fld"><span class="lbl">Tipo</span>
          <select id="m-type"><option value="entrata">Entrata</option><option value="uscita">Uscita</option></select>
        </label>
        <label class="fld"><span class="lbl">Descrizione / Voce</span><input type="text" id="m-label" required></label>
        <label class="fld"><span class="lbl">Importo (€)</span><input type="number" id="m-amount" step="any" required></label>
      `, async function(){
        var item={
          id:uid(),
          date:$('#m-date').value || todayISO(),
          type:$('#m-type').value,
          label:$('#m-label').value || 'Movimento',
          amount:parseFloat($('#m-amount').value) || 0
        };
        state.movements.unshift(item);
        await saveData('movements', item);
        closeModal();
        render();
        toast('Movimento registrato');
      });
    } else {
      var item=NEW[c]();
      state[c].unshift(item);
      await saveData(c,item);
      render();
    }
  },

  add:async function(b){
    var c=b.dataset.coll;
    var item=NEW[c]();
    state[c].unshift(item);
    await saveData(c,item);
    render();
  },

  newq:function(){q=newQuote(false);render();toast('Nuovo preventivo')},
  addx:function(){q.extras.push({label:'',amount:0});$('#extras').innerHTML=extrasHTML();updateSummary()},
  delx:function(b){q.extras.splice(+b.dataset.i,1);$('#extras').innerHTML=extrasHTML();updateSummary()},
  
  saveq:async function(){
    var rec = quoteRec('bozza');
    state.quotes.unshift(rec);
    await saveData('quotes', rec);
    $('#qhist').innerHTML = histHTML();
    toast('Preventivo salvato nello storico');
  },

  mkorder:async function(){
    var r=calc(q);var o={id:uid(),number:nextOrderNumber(),customerId:q.customerId||'',spoolId:q.spoolId||'',name:q.name||'Lavorazione',status:'nuovo',due:addDays(7),net:r.net,grams:q.grams,hours:q.hours};
    state.orders.unshift(o);await saveData('orders',o);toast('Ordine creato');location.hash='#ordini';
  },

  del:async function(b){var c=b.dataset.coll,id=b.dataset.id;state[c]=state[c].filter(x=>x.id!==id);await deleteData(c,id);render()},
  delq:async function(b){var id=b.dataset.id;state.quotes=state.quotes.filter(x=>x.id!==id);await deleteData('quotes',id);$('#qhist').innerHTML=histHTML();toast('Preventivo eliminato')}
};

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b)return;
  var act = b.dataset.action;
  if(act === 'open-modal-add'){ ACTIONS.openModalAdd(b); }
  else if(ACTIONS[act]){ ACTIONS[act](b); }
});

document.addEventListener('submit',function(e){e.preventDefault()});

$('#view').addEventListener('input',function(e){
  var t=e.target;if(t.dataset.qk!==undefined){q[t.dataset.qk]=t.type==='number'?num(t.value):t.value;updateSummary()}
});
$('#view').addEventListener('change',async function(e){
  var t=e.target;
  if(t.dataset.st && userRole === 'admin'){
    state.settings[t.dataset.st]=num(t.value);
    await saveData('settings', state.settings);
    toast('Impostazione aggiornata');
    return;
  }
  if(t.dataset.coll){
    var coll=t.dataset.coll,it=state[coll].find(function(x){return x.id===t.dataset.id});if(!it)return;
    it[t.dataset.key]=t.dataset.t==='number'?num(t.value):t.value;
    await saveData(coll,it);
    if(t.dataset.pill)t.className='st '+stClass(t.value);
  }
});
addEventListener('hashchange',route);

try{var th=localStorage.getItem(THEME_KEY);if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
checkUser();
})();
</script>
</body>
</html>
