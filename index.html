<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ADLAB3D · Gestionale Cloud</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCHERMATA DI AUTENTICAZIONE -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <polygon class="ct" points="24,5 40,14 24,23 8,14"/>
          <polygon class="cl" points="8,14 24,23 24,43 8,34"/>
          <polygon class="cr" points="24,23 40,14 40,34 24,43"/>
          <path class="ax" d="M24 43 V23 M24 43 L8 34 M24 43 L40 34"/>
        </svg>
        <div><b>ADLAB3D</b><small id="auth-title">Accedi al gestionale cloud</small></div>
      </div>
      
      <form id="auth-form" class="auth-form">
        <label class="fld">
          <span class="lbl">Email</span>
          <input type="email" id="auth-email" required placeholder="nome@adlab3d.it" autocomplete="email">
        </label>

        <label class="fld" id="pwd-field">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="lbl">Password</span>
            <button type="button" id="forgot-pwd-btn" class="link-btn">Password dimenticata?</button>
          </div>
          <div class="unit" style="padding-right:4px">
            <input type="password" id="auth-password" required placeholder="••••••••" autocomplete="current-password">
            <button type="button" id="toggle-pwd-vis" class="btn ghost sm" title="Mostra/Nascondi password" aria-label="Mostra password">👁️</button>
          </div>
        </label>

        <div id="auth-error" class="auth-error"></div>
        <div id="auth-success" class="auth-success"></div>

        <div class="auth-actions">
          <button class="btn pri w-full" type="submit" id="auth-submit">Accedi</button>
          <button class="btn ghost w-full sm" type="button" id="auth-toggle-btn">Non hai un account? Registrati</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODALE GENERICO -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box">
      <div class="modal-h">
        <h3 id="modal-title">Titolo</h3>
        <button class="btn ghost sm" type="button" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot">
        <button class="btn ghost sm" type="button" id="modal-cancel">Annulla</button>
        <button class="btn pri sm" type="button" id="modal-save">Conferma</button>
      </div>
    </div>
  </div>

  <!-- APPLICAZIONE PRINCIPALE -->
  <div id="app-container" style="display:none;">
    <div class="shell">
      <aside class="side">
        <a class="brand" href="#panoramica">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <polygon class="ct" points="24,5 40,14 24,23 8,14"/>
            <polygon class="cl" points="8,14 24,23 24,43 8,34"/>
            <polygon class="cr" points="24,23 40,14 40,34 24,43"/>
            <path class="ax" d="M24 43 V23 M24 43 L8 34 M24 43 L40 34"/>
          </svg>
          <span><b>ADLAB3D</b><small id="user-email-display">Firebase Sync</small></span>
        </a>
        <nav class="nav" id="nav" aria-label="Sezioni"></nav>
        <div class="side-foot">
          <button class="btn sm w-full" id="themebtn" data-action="theme" type="button">Cambia tema</button>
          <button class="btn sm danger w-full" id="logoutbtn" type="button">Esci</button>
        </div>
      </aside>
      <main id="view"></main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
