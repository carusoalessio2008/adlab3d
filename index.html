<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AdLab3D Gestionale Cloud</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface2:#e9ebf1; --field:#fafbfd; --line:#d9dce5;
  --fg:#13161e; --muted:#586073; --accent:#d9480f; --accent-fg:#ffffff; --accent-soft:#fde4d6;
  --ok:#17794a; --ok-soft:#d9f2e4; --warn:#9a5b00; --warn-soft:#fbe9c6; --bad:#b4302f; --bad-soft:#f9dbdb; --info:#2956c9; --info-soft:#dde7fb;
  --cube-t:#4a505c; --cube-l:#1a1d24; --cube-r:#0b0c10;
  --seg-mat:#d9480f; --seg-en:#2956c9; --seg-lab:#17794a; --seg-mach:#b07d12; --seg-oth:#7b8294;
  --font-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface2:#1f2430; --field:#11151c; --line:#2b3242;
  --fg:#e7eaf1; --muted:#98a1b4; --accent:#ff7a3d; --accent-fg:#1a0e06; --accent-soft:#3b2314;
  --ok:#56c88a; --ok-soft:#143023; --warn:#e8b04a; --warn-soft:#38290e; --bad:#ff8080; --bad-soft:#3b1c1c; --info:#7ea5ff; --info-soft:#1b2644;
  --cube-t:#eef0f5; --cube-l:#aab1bf; --cube-r:#7b8393;
  --seg-mat:#ff7a3d; --seg-en:#7ea5ff; --seg-lab:#56c88a; --seg-mach:#e8b04a; --seg-oth:#8a93a6;
  color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--font-body);margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;color:var(--fg)}
.auth-brand svg{width:40px;height:40px}
.auth-brand b{font:700 20px/1 var(--font-display)}
.auth-form{display:flex;flex-direction:column;gap:14px}

/* Modal Popup */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:450px;box-shadow:0 10px 30px rgba(0,0,0,0.15);display:flex;flex-direction:column;gap:16px}
.modal-h{display:flex;justify-content:space-between;align-items:center}
.modal-body{display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:30px;max-width:1380px;margin:0 auto;padding:22px 16px}
.side{position:sticky;top:22px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--fg)}
.brand svg{width:40px;height:40px}
.brand b{font:700 19px/1 var(--font-display)}
.ct{fill:var(--cube-t)} .cl{fill:var(--cube-l)} .cr{fill:var(--cube-r)}
.ax{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;fill:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:7px;color:var(--fg);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--fg);color:var(--bg)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 15px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.w-full{width:100%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.wide{grid-column:1/-1}
.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--field)}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
textarea{min-height:80px;resize:vertical}
.unit{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--field);padding-right:10px}
.unit input{border:0;background:transparent;outline:0;min-width:0}
.unit span{color:var(--muted);font-size:12.5px}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 376px;gap:22px;align-items:start}
.qform{display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}
.sum{position:sticky;top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.big{font:700 44px/1.05 var(--font-display);margin:6px 0 4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);margin:16px 0 12px;gap:2px}
.bar i{display:block;min-width:3px}
.seg-mat{background:var(--seg-mat)} .seg-en{background:var(--seg-en)} .seg-lab{background:var(--seg-lab)} .seg-mach{background:var(--seg-mach)} .seg-oth{background:var(--seg-oth)}
.tot{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:12px;font-size:13.5px}
.tot dt{color:var(--muted)} .tot dd{margin:0;text-align:right}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-top:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font:700 32px var(--font-display);margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;transition:opacity .18s,transform .18s;z-index:200}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- SCHERMATA DI ACCESSO -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 48 48">
        <polygon class="ct" points="24,5 40,14 24,23 8,14"/>
        <polygon class="cl" points="8,14 24,23 24,43 8,34"/>
        <polygon class="cr" points="24,23 40,14 40,34 24,43"/>
        <path class="ax" d="M24 43 V23 M24 43 L8 34 M24 43 L40 34"/>
      </svg>
      <div><b>ADLAB3D</b><small>Accedi al gestionale</small></div>
    </div>
    <div class="auth-form">
      <label class="fld"><span class="lbl">Email</span><input type="email" id="auth-email" value="admin@adlab3d.it"></label>
      <label class="fld"><span class="lbl">Password</span><input type="password" id="auth-password" value="123456"></label>
      <!-- Pulsante diretto con ID dedicato per evitare qualsiasi blocco -->
      <button class="btn pri w-full" type="button" id="btn-entra">Accedi / Entra Subito</button>
    </div>
  </div>
</div>

<!-- MODALE POPUP -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-h">
      <h3 id="modal-title">Titolo</h3>
      <button class="btn ghost sm" type="button" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn ghost sm" type="button" id="modal-cancel">Annulla</button>
      <button class="btn pri sm" type="button" id="modal-save">Salva</button>
    </div>
  </div>
</div>

<!-- APP PRINCIPALE -->
<div id="app-container" style="display:none;">
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#panoramica">
        <svg viewBox="0 0 48 48">
          <polygon class="ct" points="24,5 40,14 24,23 8,14"/>
          <polygon class="cl" points="8,14 24,23 24,43 8,34"/>
          <polygon class="cr" points="24,23 40,14 40,34 24,43"/>
          <path class="ax" d="M24 43 V23 M24 43 L8 34 M24 43 L40 34"/>
        </svg>
        <span><b>ADLAB3D</b><small id="user-email-display">Gestionale Cloud</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="btn sm danger" id="logoutbtn" type="button">Esci</button>
      </div>
    </aside>
    <main id="view"></main>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function eur(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0)}
function nf(n,d){d=d==null?1:d;return new Intl.NumberFormat('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayISO(){return iso(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}

let state = {
  settings:{energy:0.30,prepMin:5,prepRate:15,postMin:5,postRate:15,markMat:30,markEn:0,markLab:0,markMach:20,markOther:0,minPrice:3,vat:22},
  customers:[{id:uid(), name:'Mario Rossi', phone:'3331234567', email:'mario@rossi.it', note:'Cliente abituale'}],
  printers:[{id:uid(), name:'Bambu Lab X1C', watts:250, price:1200, years:3, hoursDay:10, repair:10}],
  spools:[{id:uid(), material:'PLA', colorName:'Nero', color:'#111', price:22, weight:1000, residual:850}],
  orders:[{id:uid(), number:'AD-2026-001', name:'Supporto Monitor', status:'nuovo', due:addDays(5), net:45, grams:120, hours:3}],
  quotes:[],
  movements:[{id:uid(), date:todayISO(), type:'entrata', label:'Vendita filamento', amount:35}],
  files:[]
};

var q = null;
var view = 'panoramica';
let activeModalCallback = null;

// GESTIONE DIRETTA DEL CLICK SUL PULSANTE DI ACCESSO
document.getElementById('btn-entra').addEventListener('click', function(e) {
  e.preventDefault();
  $('#auth-screen').style.display = 'none';
  $('#app-container').style.display = 'block';
  route();
});

$('#logoutbtn').addEventListener('click', function(){
  location.reload();
});

// Modali Popup
function openModal(title, htmlContent, onSave){
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = htmlContent;
  activeModalCallback = onSave;
  $('#modal-overlay').classList.add('open');
}
function closeModal(){
  $('#modal-overlay').classList.remove('open');
  activeModalCallback = null;
}
$('#modal-close').addEventListener('click', closeModal);
$('#modal-cancel').addEventListener('click', closeModal);
$('#modal-save').addEventListener('click', function(){
  if(activeModalCallback) activeModalCallback();
});

var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2500)}

// Preventivo
function newQuote(){
  var s=state.settings,p=state.printers[0],sp=state.spools[0];
  return {
    name:'',customerId:state.customers[0]?state.customers[0].id:'',
    hours:2,minutes:30,grams:50,
    spoolId:sp?sp.id:'',spoolPrice:sp?sp.price:20,spoolWeight:sp?sp.weight:1000,markMat:s.markMat,
    printerId:p?p.id:'',watts:p?p.watts:150,energy:s.energy,markEn:s.markEn,
    prepMin:s.prepMin,prepRate:s.prepRate,postMin:s.postMin,postRate:s.postRate,markLab:s.markLab,
    machPrice:p?p.price:600,years:p?p.years:4,hoursDay:p?p.hoursDay:8,repair:p?p.repair:10,markMach:s.markMach,
    extras:[],markOther:s.markOther,minPrice:s.minPrice,vat:s.vat
  };
}

function calc(q){
  var hrs=num(q.hours)+num(q.minutes)/60;
  var mat=num(q.spoolWeight)>0?num(q.grams)/num(q.spoolWeight)*num(q.spoolPrice):0;
  var en=num(q.watts)/1000*hrs*num(q.energy);
  var lab=num(q.prepMin)/60*num(q.prepRate)+num(q.postMin)/60*num(q.postRate);
  var mach=hrs*(num(q.machPrice)/(num(q.years)*365*num(q.hoursDay))*(1+num(q.repair)/100));
  var oth=(q.extras||[]).reduce(function(a,x){return a+num(x.amount)},0);
  var def=[['mat','Filamento',mat,q.markMat],['en','Elettricità',en,q.markEn],['lab','Manodopera',lab,q.markLab],['mach','Macchina',mach,q.markMach],['oth','Altri',oth,q.markOther]];
  var rows=def.map(function(d){var m=num(d[3]);return {id:d[0],label:d[1],cost:d[2],mark:m,price:d[2]*(1+m/100)}});
  var cost=rows.reduce(function(a,r){return a+r.cost},0);
  var sub=rows.reduce(function(a,r){return a+r.price},0);
  var net=Math.round(Math.max(sub,num(q.minPrice))*100)/100;
  var vat=Math.round(net*num(q.vat))/100;
  return {hrs:hrs,rows:rows,cost:cost,sub:sub,net:net,vat:vat,total:Math.round((net+vat)*100)/100};
}

var QS=[
  {id:'info',t:'Informazioni',f:[
    {k:'name',l:'Nome lavorazione',t:'text',wide:1},
    {k:'customerId',l:'Cliente',t:'select',o:function(){return [['','Nessun cliente']].concat(state.customers.map(function(c){return [c.id,c.name]}))}},
    {k:'hours',l:'Ore',t:'number'},{k:'minutes',l:'Minuti',t:'number'},{k:'grams',l:'Grammi',t:'number'}]},
  {id:'mat',t:'Materiale',f:[
    {k:'spoolPrice',l:'Prezzo bobina €',t:'number'},{k:'spoolWeight',l:'Peso bobina g',t:'number'},{k:'markMat',l:'Ricarico %',t:'number'}]},
  {id:'fin',t:'IVA e Minimo',nosub:1,f:[
    {k:'minPrice',l:'Prezzo minimo €',t:'number'},{k:'vat',l:'IVA %',t:'number'}]}
];

function fieldHTML(f){
  var v=q[f.k];
  if(f.t==='select'){
    return '<label class="fld"><span class="lbl">'+f.l+'</span><select id="q_'+f.k+'" data-qk="'+f.k+'">'+f.o().map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>';
  }
  return '<label class="fld"><span class="lbl">'+f.l+'</span><input id="q_'+f.k+'" data-qk="'+f.k+'" type="'+f.t+'" value="'+esc(v)+'"></label>';
}

function sectionsHTML(){
  return QS.map(s=>'<section class="sec"><div class="sec-h"><h3>'+s.t+'</h3></div><div class="fgrid">'+s.f.map(fieldHTML).join('')+'</div></section>').join('');
}

function updateSummary(){
  var el=$('#summary');if(!el||!q)return;
  var r=calc(q);
  el.innerHTML='<p class="eyebrow">Totale</p><div class="big">'+eur(r.total)+'</div><dl class="tot"><dt>Imponibile</dt><dd>'+eur(r.net)+'</dd><dt>IVA</dt><dd>'+eur(r.vat)+'</dd></dl><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;"><button class="btn" type="button" data-action="saveq">Salva in storico</button><button class="btn pri" type="button" data-action="mkorder">Crea ordine</button></div>';
}

function histHTML(){
  if(!state.quotes.length)return '<div class="empty" style="padding:15px;color:var(--muted)">Nessun preventivo salvato.</div>';
  return '<div class="tw"><table><thead><tr><th>Lavorazione</th><th>Totale</th><th></th></tr></thead><tbody>'+state.quotes.map(r=>'<tr><td>'+esc(r.q.name||'Senza nome')+'</td><td>'+eur(r.total)+'</td><td><button class="btn ghost sm" data-action="delq" data-id="'+r.id+'">Elimina</button></td></tr>').join('')+'</tbody></table></div>';
}

function table(coll,cols,items,empty){
  if(!items.length)return '<div class="empty" style="padding:15px;color:var(--muted)">'+empty+'</div>';
  return '<div class="tw"><table><thead><tr>'+cols.map(c=>'<th>'+c.l+'</th>').join('')+'<th></th></tr></thead><tbody>'+
    items.map(it=>'<tr>'+cols.map(c=>'<td>'+esc(it[c.k]||'—')+'</td>').join('')+'<td style="text-align:right"><button class="btn ghost sm" data-action="del" data-coll="'+coll+'" data-id="'+it.id+'">Elimina</button></td></tr>').join('')+
    '</tbody></table></div>';
}

var VIEWS=[['panoramica','Panoramica'],['preventivi','Preventivi'],['ordini','Ordini'],['clienti','Clienti'],['magazzino','Magazzino'],['contabilita','Contabilità']];
var V={};
V.panoramica=()=>'<header class="ph"><h1>Panoramica</h1></header><div class="kpis"><div class="kpi"><small>Ordini attivi</small><b>'+state.orders.length+'</b></div><div class="kpi"><small>Clienti</small><b>'+state.customers.length+'</b></div></div>';
V.preventivi=function(){if(!q)q=newQuote();return '<header class="ph"><h1>Preventivi</h1><button class="btn" data-action="newq">Nuovo</button></header><div class="qgrid"><form class="qform">'+sectionsHTML()+'</form><aside class="sum" id="summary"></aside></div><h2 style="margin:20px 0 10px">Storico</h2><div id="qhist">'+histHTML()+'</div>'};
V.ordini=()=>'<header class="ph"><h1>Ordini</h1></header>'+table('orders',[{k:'number',l:'Num'},{k:'name',l:'Lavorazione'},{k:'status',l:'Stato'}],state.orders,'Nessun ordine');
V.clienti=()=>'<header class="ph"><h1>Clienti</h1><button class="btn pri" data-action="open-modal-add" data-coll="customers">Nuovo cliente</button></header>'+table('customers',[{k:'name',l:'Nome'},{k:'phone',l:'Tel'},{k:'email',l:'Email'}],state.customers,'Nessun cliente');
V.magazzino=()=>'<header class="ph"><h1>Magazzino Bobine</h1><button class="btn pri" data-action="open-modal-add" data-coll="spools">Nuova bobina</button></header>'+table('spools',[{k:'material',l:'Materiale'},{k:'colorName',l:'Colore'},{k:'residual',l:'Residuo g'}],state.spools,'Nessuna bobina');
V.contabilita=()=>'<header class="ph"><h1>Contabilità</h1><button class="btn pri" data-action="open-modal-add" data-coll="movements">Nuovo movimento</button></header>'+table('movements',[{k:'date',l:'Data'},{k:'label',l:'Voce'},{k:'amount',l:'Importo €'}],state.movements,'Nessun movimento');

var AFTER={preventivi:updateSummary};
function nav(){$('#nav').innerHTML=VIEWS.map(v=>'<a href="#'+v[0]+'" class="'+(v[0]===view?'on':'')+'">'+v[1]+'</a>').join('')}
function render(){nav();$('#view').innerHTML=V[view]();if(AFTER[view])AFTER[view]()}
function route(){var h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:'panoramica';render()}

var ACTIONS={
  'open-modal-add':function(b){
    var c=b.dataset.coll;
    if(c==='customers'){
      openModal('Nuovo Cliente', '<label class="fld"><span class="lbl">Nome</span><input type="text" id="m-name" required></label><label class="fld"><span class="lbl">Telefono</span><input type="text" id="m-phone"></label><label class="fld"><span class="lbl">Email</span><input type="email" id="m-email"></label>', function(){
        state.customers.unshift({id:uid(), name:$('#m-name').value||'Cliente', phone:$('#m-phone').value, email:$('#m-email').value});
        closeModal(); render(); toast('Cliente aggiunto');
      });
    } else if(c==='spools'){
      openModal('Nuova Bobina', '<label class="fld"><span class="lbl">Materiale</span><select id="m-mat"><option>PLA</option><option>PETG</option><option>ABS</option></select></label><label class="fld"><span class="lbl">Colore</span><input type="text" id="m-color" value="Nero"></label><label class="fld"><span class="lbl">Grammi residui</span><input type="number" id="m-res" value="1000"></label>', function(){
        state.spools.unshift({id:uid(), material:$('#m-mat').value, colorName:$('#m-color').value, residual:num($('#m-res').value)});
        closeModal(); render(); toast('Bobina aggiunta');
      });
    } else if(c==='movements'){
      openModal('Nuovo Movimento', '<label class="fld"><span class="lbl">Voce</span><input type="text" id="m-label" required></label><label class="fld"><span class="lbl">Importo €</span><input type="number" id="m-amount" step="any" required></label>', function(){
        state.movements.unshift({id:uid(), date:todayISO(), label:$('#m-label').value, amount:num($('#m-amount').value)});
        closeModal(); render(); toast('Movimento aggiunto');
      });
    }
  },
  newq:function(){q=newQuote();render();toast('Nuovo preventivo')},
  saveq:function(){state.quotes.unshift({id:uid(),q:JSON.parse(JSON.stringify(q)),total:calc(q).total});$('#qhist').innerHTML=histHTML();toast('Salvato nello storico')},
  mkorder:function(){var r=calc(q);state.orders.unshift({id:uid(),number:'AD-999',name:q.name||'Lavorazione',status:'nuovo',due:addDays(7)});toast('Ordine creato');location.hash='#ordini'},
  del:function(b){state[b.dataset.coll]=state[b.dataset.coll].filter(x=>x.id!==b.dataset.id);render()},
  delq:function(b){state.quotes=state.quotes.filter(x=>x.id!==b.dataset.id);$('#qhist').innerHTML=histHTML();}
};

document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(b&&ACTIONS[b.dataset.action])ACTIONS[b.dataset.action](b)});
$('#view').addEventListener('input',function(e){var t=e.target;if(t.dataset.qk){q[t.dataset.qk]=t.type==='number'?num(t.value):t.value;updateSummary()}});
addEventListener('hashchange',route);
</script>
</body>
</html>
